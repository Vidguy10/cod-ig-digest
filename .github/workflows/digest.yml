name: Daily COD digest

on:
     repository_dispatch:
       types: [apify-done]
     schedule:
       # Backups. UTC: 12:20/12:40 = 5:20/5:40 AM PT in summer, 13:20/13:40 = 5:20/5:40 AM PT in winter.
       - cron: "20,40 12,13 * * *"
     workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Pull latest Apify run and rebuild page
        run: python update.py
      - name: Publish
        run: |
          git config user.name "COD digest bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Digest update $(date -u +%Y-%m-%d)" || echo "No changes"
          # If the repo moved on while this ran, rebuild on top of the latest files and retry.
          if ! git push; then
            git fetch origin main
            git reset --hard origin/main
            python update.py
            git add -A
            git commit -m "Digest update $(date -u +%Y-%m-%d)" || echo "No changes"
            git push
          fi
