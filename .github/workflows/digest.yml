name: Daily COD digest

on:
  schedule:
    # GitHub schedules run in UTC and can start a few minutes late.
    # 12:15 and 13:15 UTC = 5:15 and 6:15 AM Pacific in summer (4:15 and 5:15 AM in winter),
    # so at least one run always lands after the 4:58 AM PT Apify scrape. Re-runs are harmless.
    - cron: "15 12 * * *"
    - cron: "15 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull latest Apify run and rebuild page
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python update.py
      - name: Publish
        run: |
          git config user.name "COD digest bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Digest update $(date -u +%Y-%m-%d)" || echo "No changes"
          # If the repo moved on while this ran, rebuild on top of the latest files and retry.
          if ! git push; then
            git fetch origin main
            git reset --hard origin/main
            python update.py
            git add -A
            git commit -m "Digest update $(date -u +%Y-%m-%d)" || echo "No changes"
            git push
          fi
